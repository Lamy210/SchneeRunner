name: SchneeRunner CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swiftpm:
    name: SwiftPM build and test
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test

      - name: Build release bundle smoke artifact
        env:
          RELEASE_VERSION: 0.0.0
        run: bash scripts/ci/build-release-artifact.sh

      - name: Ad-hoc sign sandboxed release bundle
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - --entitlements SchneeRunner.entitlements build/SchneeRunner.app
          codesign --verify --deep --strict build/SchneeRunner.app
          codesign --display --entitlements :- build/SchneeRunner.app >build/actual-entitlements.plist 2>/dev/null
          [[ "$(plutil -extract com.apple.security.app-sandbox raw -o - build/actual-entitlements.plist)" == "true" ]]
          [[ "$(plutil -extract com.apple.security.files.user-selected.read-write raw -o - build/actual-entitlements.plist)" == "true" ]]

      - name: Launch release bundle smoke artifact
        env:
          APP_PATH: build/SchneeRunner.app
        run: bash scripts/release/smoke-launch-app.sh
