name: SchneeRunner CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swiftpm:
    name: SwiftPM build and test
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test

      - name: Build release bundle smoke artifact
        env:
          RELEASE_VERSION: 0.0.0
        run: bash scripts/ci/build-release-artifact.sh

      - name: Ad-hoc sign sandboxed release bundle
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - --entitlements SchneeRunner.entitlements build/SchneeRunner.app

      - name: Verify sandboxed release signature
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict build/SchneeRunner.app

      - name: Extract sandboxed release entitlements
        shell: bash
        run: |
          set -euo pipefail
          codesign --display --entitlements :- build/SchneeRunner.app >build/actual-entitlements.plist 2>/dev/null

      - name: Verify sandboxed release entitlements
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path("build/actual-entitlements.plist")
          with path.open("rb") as handle:
              entitlements = plistlib.load(handle)

          expected = {
              "com.apple.security.app-sandbox": True,
              "com.apple.security.files.user-selected.read-write": True,
          }
          for key, expected_value in expected.items():
              actual = entitlements.get(key)
              if actual != expected_value:
                  raise SystemExit(
                      f"expected embedded entitlement {key}={expected_value!r}, got {actual!r}"
                  )
          PY

      - name: Launch release bundle smoke artifact
        env:
          APP_PATH: build/SchneeRunner.app
        shell: bash
        run: |
          set -euo pipefail
          if bash scripts/release/smoke-launch-app.sh; then
            exit 0
          fi

          echo "::group::Recent SchneeRunner launch diagnostics"
          /usr/bin/log show \
            --style compact \
            --last 3m \
            --info \
            --debug \
            --predicate 'process == "SchneeRunner" OR eventMessage CONTAINS[c] "SchneeRunner"' \
            || true

          reports_dir="${HOME}/Library/Logs/DiagnosticReports"
          if [[ -d "${reports_dir}" ]]; then
            while IFS= read -r -d '' report; do
              echo "--- ${report} ---"
              sed -n '1,240p' "${report}" || true
            done < <(find "${reports_dir}" -type f -mmin -5 -iname '*SchneeRunner*' -print0)
          fi
          echo "::endgroup::"
          exit 1